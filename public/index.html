<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokemon RPG - City League</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">

	<section id="screen-picker" class="screen">
		<h1>City League</h1>
		<p class="hint">Pick your region and rental core to challenge the City League.</p>
		<div id="region-list" class="region-list"></div>
	</section>

	<section id="screen-roster" class="screen hidden">
		<h1 id="roster-title">Edit your lineup</h1>
		<p class="hint">Tap a move to swap it for anything this Pokemon can learn.</p>
		<div id="roster-grid" class="roster-grid"></div>
		<button id="roster-confirm" class="core-btn confirm-btn">Continue to Team Preview</button>
	</section>

	<section id="screen-preview" class="screen hidden">
		<h1>Choose your team</h1>
		<div class="foe-preview-block">
			<div class="foe-preview-label" id="foe-preview-label">Opponent's team</div>
			<div id="foe-preview-grid" class="foe-preview-grid"></div>
		</div>
		<p class="hint" id="preview-hint"></p>
		<div id="preview-grid" class="preview-grid"></div>
		<button id="preview-confirm" class="core-btn confirm-btn" disabled>Confirm team</button>
	</section>

	<section id="screen-battle" class="screen hidden">
		<div class="battle-header">
			<span id="opponent-name"></span>
		</div>

		<div id="switch-panel" class="switch-panel hidden"></div>

		<div class="field">
			<div class="side foe-side">
				<div class="slot" data-side="foe" data-slot="0"></div>
				<div class="slot" data-side="foe" data-slot="1"></div>
			</div>
			<div class="side you-side">
				<div class="slot" data-side="you" data-slot="0"></div>
				<div class="slot" data-side="you" data-slot="1"></div>
			</div>
		</div>

		<div id="action-panel" class="action-panel"></div>

		<div id="log" class="log"></div>
	</section>

	<section id="screen-end" class="screen hidden">
		<h1 id="end-title"></h1>
		<button id="btn-again">Play again</button>
	</section>

</div>
<script src="/app.js"></script>
</body>
</html>
